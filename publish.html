<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نشر مقال — Debt Table 313</title>
<meta name="color-scheme" content="dark light">
<style>
  :root{
    --bg:#0a0e17;--panel:#131b2a;--line:#25303f;--text:#e8eef8;--muted:#93a2b8;--accent:#38d6b0;--radius:16px;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f7f9fc;--panel:#fff;--line:#dbe3ee;--text:#0d1520;--muted:#5c6b80;--accent:#0f9d7d;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif;line-height:1.8}
  header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1100px;margin:0 auto;padding:12px 18px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
  .links{display:flex;gap:12px;flex-wrap:wrap}
  .links a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px}
  .links a.active,.links a:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 14%, transparent)}
  main{max-width:900px;margin:0 auto;padding:28px 18px;display:grid;gap:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 30px 60px -40px rgba(0,0,0,.9);overflow:hidden}
  .panel-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
  .panel-header h1{margin:0;font-size:clamp(20px,4vw,32px)}
  .panel-header p{margin:4px 0 0;color:var(--muted)}
  .form{display:grid;gap:16px;padding:22px}
  .field{display:grid;gap:8px}
  label{font-weight:600}
  input,textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;padding:10px 14px;resize:vertical}
  textarea{min-height:320px;line-height:2}
  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
  .btn{border:1px solid transparent;border-radius:999px;padding:9px 18px;font:inherit;display:inline-flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#5b8cff);color:#06110d}
  .btn-ghost{border-color:var(--line);color:var(--muted)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="index.html">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" opacity=".4"/><path d="M7 12h10M12 7l5 5-5 5" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><strong>Debt Table 313</strong><div style="color:var(--muted);font-size:12px">نشر مقالات</div></div>
      </a>
      <div class="links">
        <a href="index.html">الرئيسية</a>
        <a href="articles.html">كل المقالات</a>
        <a class="active" href="publish.html">نشر مقال</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="panel">
      <header class="panel-header">
        <div>
          <h1>نشر مقال جديد</h1>
          <p>اكتب العنوان والمحتوى ثم انشر مباشرةً</p>
        </div>
      </header>
      <form class="form" id="publishForm">
        <div class="field">
          <label for="title">عنوان المقال</label>
          <input id="title" name="title" required placeholder="اكتب عنوان المقال هنا">
        </div>
        <div class="field">
          <label for="content">محتوى المقال</label>
          <textarea id="content" name="content" required placeholder="اكتب المقال كاملًا هنا... يمكنك استخدام فقرات سطرية فقط"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-ghost" type="button" id="clearBtn">مسح</button>
          <button class="btn btn-primary" type="submit">نشر المقال</button>
        </div>
      </form>
    </section>
  </main>
  <div class="toast" id="toast">تم النشر بنجاح</div>
  <script>
    const form = document.getElementById('publishForm');
    const title = document.getElementById('title');
    const content = document.getElementById('content');
    const toast = document.getElementById('toast');
    const clearBtn = document.getElementById('clearBtn');

    function loadPosts(){
      try{ const raw = localStorage.getItem('dt_posts'); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
    }
    function savePosts(list){ localStorage.setItem('dt_posts', JSON.stringify(list)); }

    form.addEventListener('submit', function(e){
      e.preventDefault();
      const t = title.value.trim();
      const c = content.value.trim();
      if(!t || !c) return;
      const posts = loadPosts();
      const id = 'post-' + Date.now().toString(36);
      const now = new Date().toISOString();
      posts.unshift({
        id: id,
        title: t,
        content: c.replace(/\n/g,'<br>'),
        excerpt: c.slice(0,160).replace(/\n/g,' '),
        status: 'published',
        publishedAt: now,
        createdAt: now,
        updatedAt: now
      });
      savePosts(posts);
      toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); window.location.href = 'index.html'; }, 700);
    });

    clearBtn.addEventListener('click', function(){ form.reset(); title.focus(); });
  </script>
</body>
</html>
