<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4">

    <!-- Container designed to replicate a mobile screen layout -->
    <div class="w-full max-w-sm flex flex-col justify-center items-center px-4">
        
        <form class="w-full flex flex-col gap-4" onsubmit="event.preventDefault();">
            <!-- Username Input -->
            <div>
                <input 
                    type="text" 
                    placeholder="اسم المستخدم" 
                    required 
                    class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:bg-white transition-all duration-200 text-base"
                />
            </div>

            <!-- Password Input -->
            <div>
                <input 
                    type="password" 
                    placeholder="كلمة المرور" 
                    required 
                    class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:bg-white transition-all duration-200 text-base"
                />
            </div>

            <!-- Login Button -->
            <button 
                type="submit" 
                class="w-full py-3.5 mt-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl transition-colors duration-200 text-base shadow-sm"
            >
                تسجيل الدخول
            </button>
        </form>

    </div>

</body>
</html>
