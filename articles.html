<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كل المقالات — Debt Table 313</title>
<meta name="color-scheme" content="dark light">
<style>
  :root{
    --bg:#0a0e17;--panel:#131b2a;--line:#25303f;--text:#e8eef8;--muted:#93a2b8;--accent:#38d6b0;--radius:16px;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f7f9fc;--panel:#fff;--line:#dbe3ee;--text:#0d1520;--muted:#5c6b80;--accent:#0f9d7d;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif;line-height:1.8}
  header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1100px;margin:0 auto;padding:12px 18px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
  .links{display:flex;gap:12px;flex-wrap:wrap}
  .links a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px}
  .links a.active,.links a:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 14%, transparent)}
  main{max-width:1100px;margin:0 auto;padding:28px 18px;display:grid;gap:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
  .panel-header h1{margin:0;font-size:clamp(20px,4vw,32px)}
  .panel-header p{margin:4px 0 0;color:var(--muted)}
  .list{display:grid}
  .item{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item-title{font-weight:700;text-decoration:none}
  .item-meta{color:var(--muted);font-size:14px}
  .actions{display:flex;gap:8px}
  .btn{border:1px solid var(--line);border-radius:999px;padding:7px 14px;text-decoration:none;color:var(--muted);font-size:14px}
  .btn:hover{color:var(--text)}
  .empty{padding:40px 22px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="index.html">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" opacity=".4"/><path d="M7 12h10M12 7l5 5-5 5" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><strong>Debt Table 313</strong><div style="color:var(--muted);font-size:12px">كل المقالات</div></div>
      </a>
      <div class="links">
        <a href="index.html">الرئيسية</a>
        <a class="active" href="articles.html">كل المقالات</a>
        <a href="publish.html">نشر مقال</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="panel">
      <header class="panel-header">
        <div>
          <h1>كل المقالات</h1>
          <p>المقالات المنشورة</p>
        </div>
        <a class="btn" href="publish.html">+ نشر مقال جديد</a>
      </header>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>لا توجد مقالات بعد، <a href="publish.html">ابدأ بالنشر</a></div>
    </section>
  </main>
  <script>
    function loadPosts(){
      try{ const raw = localStorage.getItem('dt_posts'); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
    }
    function formatDate(d){
      try{ return new Date(d).toLocaleDateString('ar-SA'); }catch(e){ return ''; }
    }
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const posts = loadPosts().filter(function(p){ return p && p.status === 'published'; });
    if(posts.length === 0){ empty.hidden = false; }
    posts.sort(function(a,b){ return new Date(b.publishedAt||b.createdAt||0)-new Date(a.publishedAt||a.createdAt||0); });
    posts.forEach(function(p){
      const el = document.createElement('article');
      el.className = 'item';
      el.innerHTML = '<div><a class="item-title" href="post.html?id=' + encodeURIComponent(p.id) + '">' + p.title.replace(/</g,'&lt;') + '</a><div class="item-meta">' + formatDate(p.publishedAt||p.createdAt) + '</div></div><div class="actions"><a class="btn" href="post.html?id=' + encodeURIComponent(p.id) + '">قراءة</a></div>';
      list.appendChild(el);
    });
  </script>
</body>
</html>
