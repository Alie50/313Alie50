<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debt Table 313 — نشر مقالات</title>
<meta name="color-scheme" content="dark light">
<style>
  :root{
    --bg:#0a0e17;--panel:#131b2a;--line:#25303f;--text:#e8eef8;--muted:#93a2b8;--accent:#38d6b0;--radius:16px;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f7f9fc;--panel:#fff;--line:#dbe3ee;--text:#0d1520;--muted:#5c6b80;--accent:#0f9d7d;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif;line-height:1.8}
  header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1100px;margin:0 auto;padding:12px 18px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
  .links{display:flex;gap:12px;flex-wrap:wrap}
  .links a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px}
  .links a.active,.links a:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 14%, transparent)}
  main{max-width:1100px;margin:0 auto;padding:28px 18px;display:grid;gap:24px}
  .hero{display:grid;gap:12px;text-align:center;padding:40px 18px}
  .hero h1{margin:0;font-size:clamp(28px,6vw,56px);line-height:1.2}
  .hero p{margin:0;color:var(--muted);font-size:clamp(16px,2vw,20px)}
  .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .btn{border:1px solid transparent;border-radius:999px;padding:10px 20px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#5b8cff);color:#06110d}
  .btn-ghost{border-color:var(--line);color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .card{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-decoration:none;color:inherit}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 60%, var(--line))}
  .card h2{margin:0;font-size:22px}
  .card p{margin:0;color:var(--muted)}
  .meta{color:var(--muted);font-size:14px}
</style>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="brand" href="index.html">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" opacity=".4"/><path d="M7 12h10M12 7l5 5-5 5" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><strong>Debt Table 313</strong><div style="color:var(--muted);font-size:12px">منصة نشر بسيطة</div></div>
      </a>
      <div class="links">
        <a class="active" href="index.html">الرئيسية</a>
        <a href="articles.html">كل المقالات</a>
        <a href="publish.html">نشر مقال</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1>اكتب وانشر مقالاتك مباشرةً</h1>
      <p>منصة بسيطة للنشر فقط، اكتب عنوانًا ومحتوى وانشره فورًا</p>
      <div class="actions">
        <a class="btn btn-primary" href="publish.html">ابدأ بالنشر</a>
        <a class="btn btn-ghost" href="articles.html">عرض المقالات</a>
      </div>
    </section>
    <section>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <h2 style="margin:0">أحدث المقالات</h2>
        <a class="btn btn-ghost" href="articles.html">كل المقالات</a>
      </div>
      <div class="grid" id="latest"></div>
      <div id="empty" style="text-align:center;color:var(--muted);padding:20px" hidden>لا توجد مقالات بعد</div>
    </section>
  </main>
  <script>
    function loadPosts(){
      try{ const raw = localStorage.getItem('dt_posts'); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
    }
    function formatDate(d){
      try{ return new Date(d).toLocaleDateString('ar-SA'); }catch(e){ return ''; }
    }
    const latest = document.getElementById('latest');
    const empty = document.getElementById('empty');
    const posts = loadPosts().filter(function(p){ return p && p.status === 'published'; });
    posts.sort(function(a,b){ return new Date(b.publishedAt||b.createdAt||0)-new Date(a.publishedAt||a.createdAt||0); });
    if(posts.length === 0){ empty.hidden = false; }
    posts.slice(0,6).forEach(function(p){
      const a = document.createElement('a');
      a.className = 'card';
      a.href = 'post.html?id=' + encodeURIComponent(p.id);
      a.innerHTML = '<div class="meta">' + formatDate(p.publishedAt||p.createdAt) + '</div><h2>' + p.title.replace(/</g,'&lt;') + '</h2><p>' + (p.excerpt||'').replace(/</g,'&lt;') + '</p>';
      latest.appendChild(a);
    });
  </script>
</body>
</html>
