<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة</title>
    <script>
        // التحقق الأمني: إذا لم يتم تسجيل الدخول، يتم التحويل فوراً لصفحة تسجيل الدخول ومنع الدخول
        if (sessionStorage.getItem('is_logged_in') !== 'true') {
            window.location.replace('login.html');
        }
    </script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-6">
    <div class="max-w-4xl mx-auto">
        <!-- شريط علوي مع زر تسجيل الخروج -->
        <header class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-100 flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-bold text-gray-800">لوحة الإدارة</h1>
                <p class="text-xs text-green-600 font-medium mt-0.5">● تم تسجيل الدخول بنجاح</p>
            </div>
            <button 
                onclick="logout()" 
                class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-sm font-semibold transition-colors duration-200 cursor-pointer"
            >
                تسجيل الخروج
            </button>
        </header>

        <!-- مساحة محتوى صفحة الأدمن (محمية ومعدة للمرحلة القادمة) -->
        <main class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl mb-4 text-2xl font-bold">
                ✓
            </div>
            <h2 class="text-lg font-bold text-gray-800 mb-2">أهلاً بك في صفحة الأدمن</h2>
            <p class="text-gray-500 text-sm max-w-md mx-auto">
                هذه الصفحة محمية بالكامل ولا يمكن الوصول إليها إلا بعد إدخال كلمة المرور في صفحة تسجيل الدخول. الملف جاهز الآن لتطبيق أي تصميم أو وظائف برمجية قادمة.
            </p>
        </main>
    </div>

    <script>
        function logout() {
            sessionStorage.removeItem('is_logged_in');
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
